[package]
name = "orange-loaf"
version = "0.1.0"
description = "OrangeLoaf — a desktop video encoder GUI for FFmpeg"
edition = "2024"
rust-version = "1.98.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orange_loaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
time = "0.3"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
uuid = { version = "1.29.2", features = ["v4"] }
which = "8.0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Enables tauri::test::mock_app(), and — via #[default_runtime]'s
# feature-gated codegen — makes plain `AppHandle`/`State` throughout this
# crate resolve to the mock runtime under `cargo test`, with no generic
# `<R: Runtime>` parameters needed anywhere in application code.
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# App (not library) code: these pedantic lints fight normal Tauri command signatures / UI code
# rather than catching real bugs, so they're deliberately relaxed here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
