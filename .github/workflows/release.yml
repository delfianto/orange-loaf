name: Release

# Tag-triggered (or manual) rather than on every push, since this builds and
# uploads a real installer artifact — not something to run on every commit.
#
# Linux-only, deliberately: Windows/macOS both need real code-signing and,
# for macOS, notarization to produce installers that don't just get flagged
# by the OS on a fresh machine — neither is set up here (no certificates,
# no Apple/Microsoft developer accounts), and it's not worth chasing for
# this project. Anyone who wants a Windows or macOS build is free to check
# out the repo and run `just build`/`cargo tauri build` themselves — the
# underlying Rust/Tauri code is still fully cross-platform, only this
# release pipeline isn't.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # No FFmpeg/FFprobe binary is downloaded or bundled here — a
      # deliberate scope decision (notes/plan.md M14), matching this app's
      # own BYO philosophy (Settings > Detected External Programs lets a
      # user point at any local install).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OrangeLoaf v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version.

            Linux only (.deb/.rpm/.AppImage) — see notes/plan.md M14 for
            why Windows/macOS builds aren't produced here. Builds are
            unsigned; the .deb/.rpm/.AppImage formats don't need that to
            install and run normally on Linux.
          releaseDraft: true
          prerelease: false
