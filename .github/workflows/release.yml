name: Release

# Tag-triggered (or manual) rather than on every push, since this builds and
# uploads real installer artifacts for all 3 platforms — not something to
# run on every commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # No FFmpeg/FFprobe binary is downloaded or bundled here — a
      # deliberate scope decision (notes/plan.md M14), matching this app's
      # own BYO philosophy (Settings > Detected External Programs lets a
      # user point at any local install). The fresh-machine smoke test this
      # milestone's acceptance criterion asks for therefore only covers
      # install -> launch -> "FFmpeg not found" detection correctly
      # reporting itself, not a full encode — that needs a runner image
      # with FFmpeg preinstalled, which isn't set up here.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Real code signing needs real, currently-unconfigured secrets
          # (notes/plan.md M14 scope note) — until these repo secrets
          # exist, every build here is genuinely unsigned, which
          # tauri-action and the OS installers both handle gracefully
          # (ad-hoc signed on macOS, unsigned on Windows/Linux):
          #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
          #            APPLE_TEAM_ID (notarization)
          #   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
        with:
          tagName: v__VERSION__
          releaseName: "Voltaic v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version.

            Builds are currently unsigned — see notes/plan.md M14 for why
            and what's needed to change that.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
